name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# A new push supersedes the run already in flight for the same pull request,
# so review fixes do not leave three platform jobs grinding on a dead commit.
# Pushes to main are grouped per commit instead: a shared group would hold only
# one pending run, so a third push could evict the middle commit's queued run
# even with cancel-in-progress off, and every released commit needs its own
# result.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  static:
    name: Repository rules
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      # Harness and UI lint rules read only docs and source, use no npm
      # dependencies, and cannot differ by operating system. They run once here
      # instead of three times in the platform matrix, and report in seconds
      # without waiting for an install or a build.
      - run: npm run harness:check

  verify:
    name: ${{ matrix.label }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - id: linux-x64
            label: Linux x64
            os: ubuntu-latest
            npm: npm
            unit: xvfb-run -a npm run test:unit
            smoke: xvfb-run -a npm run test:e2e:smoke
          - id: windows-x64
            label: Windows x64
            os: windows-latest
            npm: npm.cmd
            unit: npm.cmd run test:unit
            smoke: npm.cmd run test:e2e:smoke
          - id: mac-arm64
            label: macOS Apple Silicon
            os: macos-latest
            npm: npm
            unit: npm run test:unit
            smoke: npm run test:e2e:smoke
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: ${{ matrix.npm }} ci

      - name: Install Linux runtime dependencies
        if: matrix.id == 'linux-x64'
        run: npx playwright install-deps

      - name: Build application
        run: ${{ matrix.npm }} run build

      - name: Run unit tests
        run: ${{ matrix.unit }}

      - name: Run E2E smoke tests
        run: ${{ matrix.smoke }}
        env:
          JASMINE_E2E_OFFSCREEN: "1"
          JASMINE_E2E_WORKERS: "1"

  # The smoke tag covers 12 of the ~111 E2E tests, so the platform matrix above
  # cannot be the only automated E2E signal. The full suite runs once on Linux:
  # it is the cheapest runner, and the paths this suite exercises that do differ
  # by operating system -- window state, tray, terminal, packaging -- are
  # already tagged @smoke and therefore covered on all three platforms.
  e2e:
    name: Full E2E
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Bare Xvfb ships no window manager, and Electron's maximize, restore, and
      # minimize are requests to one: without it isMaximized() and isMinimized()
      # simply stay false. Openbox is the smallest thing that answers them.
      - name: Install Linux runtime dependencies
        run: |
          npx playwright install-deps
          sudo apt-get update
          sudo apt-get install -y openbox

      - name: Build application
        run: npm run build

      # One worker. Two finished in 3.6m against 5.4m but changed nothing else:
      # the same five specs failed either way, so parallelism was never what
      # broke them. Keep the slower, boring setting until the window-state specs
      # are proven green here.
      - name: Run full E2E suite
        run: xvfb-run -a --server-args="-screen 0 1920x1080x24" bash -c "openbox --sm-disable & npm run test:e2e"
        env:
          JASMINE_E2E_OFFSCREEN: "1"
          JASMINE_E2E_WORKERS: "1"

      - name: Upload failure artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-failures
          path: test-results/
          retention-days: 7
