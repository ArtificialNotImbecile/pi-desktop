name: Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # A newer manual prebuild supersedes an older one for the same ref. Formal
  # tag builds use a different event group and are never cancelled.
  group: release-${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'workflow_dispatch' }}

jobs:
  build:
    name: Build ${{ matrix.label }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - id: windows-x64
            label: Windows x64
            os: windows-latest
            npm: npm.cmd
            unit: npm.cmd run test:unit
            package: npx.cmd electron-builder --win nsis --x64 --publish never
            smoke: npm.cmd run test:packaged
            assets: |
              release/v*/Jasmine-Setup-*.exe
              release/v*/Jasmine-Setup-*.exe.blockmap
              release/v*/latest.yml
          - id: linux-x64
            label: Linux x64
            os: ubuntu-latest
            npm: npm
            unit: xvfb-run -a npm run test:unit
            package: npx electron-builder --linux AppImage deb --x64 --publish never
            smoke: xvfb-run -a npm run test:packaged
            assets: |
              release/v*/Jasmine-*-linux-x86_64.AppImage
              release/v*/Jasmine-*-linux-amd64.deb
              release/v*/latest-linux.yml
          - id: mac-arm64
            label: macOS Apple Silicon
            os: macos-latest
            npm: npm
            unit: npm run test:unit
            package: npx electron-builder --mac dmg zip --arm64 --publish never
            smoke: npm run test:packaged
            assets: |
              release/v*/Jasmine-*-mac-arm64.dmg
              release/v*/Jasmine-*-mac-arm64.zip
              release/v*/latest-mac.yml

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Validate release version
        run: node scripts/validate-release-version.mjs
        env:
          RELEASE_TAG: ${{ github.ref_type == 'tag' && github.ref_name || '' }}

      - name: Restore Electron download cache
        uses: actions/cache@v6
        with:
          path: ${{ runner.temp }}/electron-cache
          key: electron-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            electron-${{ runner.os }}-${{ runner.arch }}-

      - name: Install dependencies
        id: npm_ci
        continue-on-error: true
        timeout-minutes: 8
        run: ${{ matrix.npm }} ci
        env:
          electron_config_cache: ${{ runner.temp }}/electron-cache

      - name: Retry dependency install once
        if: steps.npm_ci.outcome == 'failure'
        timeout-minutes: 8
        run: ${{ matrix.npm }} ci
        env:
          electron_config_cache: ${{ runner.temp }}/electron-cache

      - name: Install Linux runtime dependencies
        if: matrix.id == 'linux-x64'
        run: npx playwright install-deps

      - name: Build application
        run: ${{ matrix.npm }} run build

      - name: Run unit tests
        run: ${{ matrix.unit }}

      - name: Run Windows release checks
        if: matrix.id == 'windows-x64'
        run: |
          npm.cmd run harness:check
          npm.cmd run test:e2e:smoke

      - name: Package application
        run: ${{ matrix.package }}
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"

      - name: Smoke-test packaged application
        run: ${{ matrix.smoke }}

      - name: Upload build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: release-${{ matrix.id }}
          path: ${{ matrix.assets }}
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish GitHub Release
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Download platform artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: release-*
          path: release-assets
          merge-multiple: true

      - name: Verify and checksum release assets
        run: node scripts/prepare-release-assets.mjs --source release-assets --output release-ready --version "${{ github.ref_name }}"

      - name: Create or update GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          version="${tag#v}"
          generated_notes="$(mktemp)"
          gh api --method POST "repos/${GITHUB_REPOSITORY}/releases/generate-notes" \
            -f tag_name="${tag}" --jq '.body' > "${generated_notes}"

          {
            echo "Jasmine ${version} is built and smoke-tested on Windows, Linux, and Apple Silicon macOS."
            echo
            echo "## Downloads"
            echo
            echo "- Windows x64: \`Jasmine-Setup-${version}-x64.exe\` (unsigned; SmartScreen may warn)"
            echo "- Linux x64: \`Jasmine-${version}-linux-x86_64.AppImage\` or \`Jasmine-${version}-linux-amd64.deb\`"
            echo "- Apple Silicon macOS: \`Jasmine-${version}-mac-arm64.dmg\`"
            echo
            echo "The macOS builds use ad-hoc signing and are not notarized. On first launch, trusted users may need to choose **System Settings → Privacy & Security → Open Anyway**. Verify assets against \`SHA256SUMS.txt\`."
            echo
            echo "## Changes"
            echo
            cat "${generated_notes}"
          } > release-notes.md

          if gh release view "${tag}" >/dev/null 2>&1; then
            gh release upload "${tag}" release-ready/* --clobber
            gh release edit "${tag}" --title "Jasmine ${version}" --notes-file release-notes.md
          else
            gh release create "${tag}" release-ready/* \
              --verify-tag \
              --title "Jasmine ${version}" \
              --notes-file release-notes.md
          fi
