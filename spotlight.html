<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Jasmine Spotlight</title>
    <script>
      try {
        const cached = JSON.parse(localStorage.getItem("jasmine.appSettings.startup") || "null");
        const colors = cached && cached.appearance;
        const validHex = (value) => /^#[0-9a-fA-F]{6}$/.test(value);
        if (cached && (cached.language === "en" || cached.language === "zh")) {
          document.documentElement.lang = cached.language === "zh" ? "zh-CN" : "en";
        }
        if (colors && ["accent", "surface", "ink", "success", "danger"].every((key) => validHex(colors[key]))) {
          for (const key of ["accent", "surface", "ink", "success", "danger"]) {
            document.documentElement.style.setProperty(`--${key}`, colors[key]);
          }
        }
      } catch {}
    </script>
    <style>
      html, body, #root { width: 100%; height: 100%; margin: 0; }
      body { background: transparent; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/renderer/spotlight.tsx"></script>
  </body>
</html>
